name: Legacy Prototype

on:
  push:
    branches:
      - legacy-system-prototype
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Use the source branch for both push and pull_request events so the two
  # triggers for this PR collapse into one active validation instead of
  # occupying separate runner slots under refs/heads/* and refs/pull/*.
  group: legacy-prototype-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Apply Pokémon Legacy core patch
        run: |
          git apply --recount --check patches/legacy_core.patch
          git apply --recount patches/legacy_core.patch

      - name: Install playable three-region Legacy prototype content
        run: |
          python3 tools/apply_legacy_prototype_content.py
          python3 tools/apply_legacy_transition_guard.py
          python3 tools/apply_legacy_hoenn_prototype.py
          python3 tools/apply_legacy_terminal_routing.py
          git diff --check

      - name: Validate three-region prototype semantics
        run: python3 tools/validate_legacy_prototype.py

      - name: Build Emerald prototype
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Run focused Legacy tests
        env:
          GAME_VERSION: EMERALD
          TEST: 1
          TESTS: legacy_system.c
        run: make -j$(nproc) check

      - name: Record build summary
        if: always()
        run: |
          echo "Pokémon Legacy prototype branch: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow validates the Legacy engine plus the temporary playable Kanto→Johto→Hoenn vertical slice." >> "$GITHUB_STEP_SUMMARY"
          echo "Semantic validation checks regional routing, encounter pools, terminal states, boss progression, and vault invariants before compilation." >> "$GITHUB_STEP_SUMMARY"
          echo "A full expansion regression suite already passed for the Legacy core. Normal prototype iteration runs the focused legacy_system.c tests after a complete Emerald build." >> "$GITHUB_STEP_SUMMARY"
          echo "Prototype content is installed deterministically so upstream line-number drift does not silently move edits." >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow intentionally does not publish a compiled commercial ROM artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Local build: bash tools/build_legacy_prototype.sh" >> "$GITHUB_STEP_SUMMARY"
