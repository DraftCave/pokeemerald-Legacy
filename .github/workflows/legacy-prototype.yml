name: Legacy Prototype

on:
  push:
    branches:
      - legacy-system-prototype
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Apply Pokémon Legacy core patch
        run: |
          git apply --recount --check patches/legacy_core.patch
          git apply --recount patches/legacy_core.patch

      - name: Install playable Legacy prototype content
        run: |
          python3 tools/apply_legacy_prototype_content.py
          python3 tools/apply_legacy_transition_guard.py
          git diff --check

      - name: Build Emerald prototype
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

      - name: Run expansion tests
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) check

      - name: Record build summary
        if: always()
        run: |
          echo "Pokémon Legacy prototype branch: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow validates the Legacy engine plus the temporary playable Kanto→Johto vertical-slice content." >> "$GITHUB_STEP_SUMMARY"
          echo "Core integration is applied from patches/legacy_core.patch; prototype content is installed deterministically by tools/apply_legacy_prototype_content.py and the region-transition PC-capacity guard by tools/apply_legacy_transition_guard.py." >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow intentionally does not publish a compiled commercial ROM artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Local build: git apply --recount patches/legacy_core.patch; python3 tools/apply_legacy_prototype_content.py; python3 tools/apply_legacy_transition_guard.py; make" >> "$GITHUB_STEP_SUMMARY"
